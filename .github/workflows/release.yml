# IMPORTANT: DO NOT RENAME THIS FILE
# It uses npm Trusted Publishing to deploy without a token.
# The workflow name and filename must match what is configured on npmjs.com.
# See README "Release with Release Please" for setup instructions.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write # needed for npm publish with provenance
  contents: write # needed to move the floating major version tag (vX.x)

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v5
      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@v6
      # https://github.com/actions/setup-node
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      # A prerelease release (cut from the `next` branch) is flagged
      # `prerelease: true` by release-please, so publish it under the `next`
      # dist-tag to keep `latest` pointing at the stable line. A normal release
      # publishes to `latest`. workflow_dispatch has no release payload, so the
      # prerelease flag is falsy and it publishes to `latest`.
      - name: Publish to npm (latest)
        if: ${{ !github.event.release.prerelease }}
        run: pnpm publish --provenance --no-git-checks
      - name: Publish to npm (next)
        if: ${{ github.event.release.prerelease }}
        run: pnpm publish --provenance --no-git-checks --tag next

      # Move a floating major version tag (e.g. v2.x) to the released commit so
      # links like github.com/<owner>/<repo>/tree/v2.x always resolve to the
      # newest release in that major line (handy for version-pinned README links).
      # Skipped for prereleases so an -rc/-alpha never yanks the stable vX.x tag,
      # and skipped for workflow_dispatch (no release payload, so the tag is empty).
      # The default GITHUB_TOKEN push does not re-trigger CI (and ci.yml only runs
      # on pushes to main/next, not tags). If you add tag protection rules on v*,
      # switch this to RELEASE_PLEASE_TOKEN.
      - name: Update major version tag
        if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }} # e.g. v2.12.0
        run: |
          major="${TAG%%.*}"               # v2.12.0 -> v2
          git tag -f "${major}.x"          # tag the checked-out release commit -> v2.x
          git push -f origin "${major}.x"
